name: Threads auto post

on:
  schedule:
    # 08:00 / 12:00 / 18:00 / 20:00 / 21:00 / 22:00 JST (UTC+9) -> 23:00(前日) / 03:00 / 09:00 / 11:00 / 12:00 / 13:00 UTC
    # (2026-10-01: 19時は閲覧が他の時間の約4分の1だったため22時に移動)
    # (2026-10-03: 12時を追加して1日6回に。12時=翻訳型・21時=驚き体験談型)
    - cron: "0 23,3,9,11,12,13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると投稿せず生成のみ行う"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      # The cheat-sheet card image is rendered with Chromium and pushed to the repo
      # (so Threads can fetch it from a public URL) before the post is published.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate and post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run post:dry
          else
            npm run post
          fi

      - name: Commit updated posted-log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted-log.json
          git diff --cached --quiet || git commit -m "chore: update posted-log.json [skip ci]"
          git push
