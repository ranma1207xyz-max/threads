name: Threads trend research

on:
  schedule:
    # 19:00 JST (UTC+9) -> 10:00 UTC (2026-10-01 オーナー決定で朝6時から変更)。
    # 19時の投稿ワークフローと同時刻に動くため、push前に最新を取り込む(下のCommitステップ)。
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore logged-in Threads session
        run: |
          mkdir -p data
          echo "${{ secrets.THREADS_SESSION_STATE_B64 }}" | base64 -d > data/threads-session.json

      - name: Research trending posts (browser-based)
        run: npm run research
        env:
          RESEARCH_DEBUG_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Upload debug screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: research-debug-screenshots
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated style-examples.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/style-examples.json
          # Downloaded post images (used by the remix posts) and pruned old days.
          git add -A research-images
          git diff --cached --quiet || git commit -m "chore: refresh style-examples.json from trend research [skip ci]"
          # The 19:00 post workflow may have pushed posted-log.json meanwhile; different file, so rebase is clean.
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
