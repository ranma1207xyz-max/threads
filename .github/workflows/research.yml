name: Threads trend research

on:
  schedule:
    # 06:00 JST (UTC+9) -> 21:00 UTC (前日)。投稿ワークフロー(9:00 JST〜)より前に実行し、
    # その日の style-examples.json を最新のトレンドで更新しておく。
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore logged-in Threads session
        run: |
          mkdir -p data
          echo "${{ secrets.THREADS_SESSION_STATE_B64 }}" | base64 -d > data/threads-session.json

      - name: Research trending posts (browser-based)
        run: npm run research

      - name: Commit updated style-examples.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/style-examples.json
          git diff --cached --quiet || git commit -m "chore: refresh style-examples.json from trend research [skip ci]"
          git push
